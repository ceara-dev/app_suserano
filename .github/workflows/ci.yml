name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  build:
    name: Build APK (deploy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: suserano-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
